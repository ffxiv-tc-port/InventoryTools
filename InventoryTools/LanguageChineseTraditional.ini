Match against a specific world==比對特定伺服器
When 'All' or 'World' is selected, choose the types of characters you want to filter against. Select an item again to unselect it.==選擇「全部」或「伺服器」時,選擇要篩選的角色類型。再次點選項目可取消選取。
When checked, match against the opposite of what is selected.==勾選後,比對與所選內容相反的項目。
