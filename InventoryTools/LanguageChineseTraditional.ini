The acquisition tracker perform an initial scan of your characters bags when you login. As the game receives multiple inventory updates, the scanner must wait a set amount of time before it's done. Adjust this to be higher if you are seeing items in your craft list randomly complete when you first login.==取得追蹤器會在你登入時對角色背包進行初始掃描。由於遊戲會收到多次物品欄更新,掃描器必須等待一段時間才能完成。若你發現剛登入時製作清單中的物品被隨機標記為完成,請調高此值。
Persist State Time (seconds)==狀態保留時間 (秒)
The acquisition tracker will track your current state(crafting, gathering, etc). It will keep this state by default for 2 seconds after it changes back to doing nothing. This is to catch any delays in the tracker, set this number higher if you find the tracker is not picking up items you craft/gather/etc==取得追蹤器會追蹤你目前的狀態(製作、採集等)。狀態回到閒置後,預設會再保留 2 秒,以涵蓋追蹤器的延遲。若你發現追蹤器沒有記錄到你製作/採集的物品,請調高此值
