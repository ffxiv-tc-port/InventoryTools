Welcome to Allagan Tools.==歡迎使用 Allagan Tools。
Allagan Tools is a plugin for Final Fantasy XIV that provides the following features:==Allagan Tools 是一款 Final Fantasy XIV 外掛，提供以下功能：
Track your inventories==追蹤你的物品欄
Plan your crafts==規劃你的製作
Provide information about items, monsters, duties and much more==提供道具、魔物、任務等各種資訊
You can open various new windows using command shortcuts(the main filter  or from the main window.==你可以透過指令快捷鍵（主篩選）或主視窗開啟各種新視窗。
If you're unsure, right-click on an item or a table row for more options!==若不確定該怎麼做，可以右鍵點擊道具或表格列以查看更多選項！
To learn about the different features, I recommend going to the settings section and reading the information provided by the ? icons.==若想了解各項功能，建議前往設定區域並閱讀 ? 圖示提供的說明資訊。
