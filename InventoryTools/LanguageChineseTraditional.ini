How should the item be sourced? As there are multiple ways to source an item, you can either rely on your list's ingredient sourcing (tab inside the craft list's settings) or you can override the source here.==此物品應如何取得?由於取得方式有多種,你可以依照清單的素材來源設定(製作清單設定中的分頁),或在此覆寫來源。
Override the price for this item. This is only used when no pricing is available. Use this to give you a rough estimate of the gil cost of your item.==覆寫此物品的價格。僅在沒有可用價格資料時使用,可用來粗略估算物品的金幣成本。
Override the market world preferences for this item. If you select a world here, the craft pricer will attempt to take prices from this world first then follow the normal rules for craft pricing.==覆寫此物品的市場伺服器偏好。若在此選擇伺服器,製作估價會優先採用該伺服器的價格,然後再依照一般估價規則。
Where should the item be sourced from? As there are sometimes multiple locations to source an item from, you can either rely on your list's zone preferences (tab inside the craft list's settings) or you can override the zone here.==此物品應從哪裡取得?由於有時有多個取得地點,你可以依照清單的區域偏好設定(製作清單設定中的分頁),或在此覆寫區域。
Should we source the item from your retainers? If there is a quantity available of the correct quality it will show up in the Items in Retainers/Bags section.==是否從你的僱員取得此物品?若有符合品質的數量,會顯示在「僱員/背包中的物品」區塊。
Should the item be HQ or NQ? For output items, the quantity needed will only reduce if you craft an item of the correct quality. For other materials this will dictate what is listed to retrieve and what counts towards the amount you need.==此物品應為 HQ 還是 NQ?對於成品,只有製作出符合品質的物品才會減少所需數量。對於其他素材,這會決定列出的取回項目以及哪些數量計入需求。
Select which recipe you wish to use for this item. Some items can be crafted by multiple classes.==選擇此物品要使用的配方。部分物品可由多個職業製作。
Match against all characters==比對所有角色
