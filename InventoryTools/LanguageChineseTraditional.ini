Checking if any items you have can go into the armoire.==檢查持有的物品中哪些可以放入收藏櫃。
Putting away materials after a craft and not having them double up.==製作後收納素材,避免重複堆疊。
Store items above a certain item level within your chocobo saddlebag for later.==將高於特定道具等級的物品存放到陸行鳥鞍囊備用。
