Craft System Notice==製作系統公告
The craft system has received an update, and your default configuration has been reset. Please readjust it according to your preferences.==製作系統已更新，你的預設設定已被重置，請依照你的偏好重新調整。
You can now copy configurations between your craft lists.==你現在可以在你的製作清單之間複製設定。
Two new columns have been added to your craft lists: 'Next Step' and 'Settings'.==你的製作清單新增了兩個欄位：「下一步」與「設定」。
The 'Next Step' column provides guidance on what you should do next.==「下一步」欄位會提供你接下來該做什麼的指引。
The 'Settings' column allows you to configure item sourcing, retainer settings, and recipes.==「設定」欄位可讓你設定物品來源、僱員設定與配方。
The update includes the following changes:==此次更新包含以下變更：
You can now change groupings for crafts based on class or required crafting order.==你現在可以依職業或所需的製作順序來變更製作項目的分組方式。
Retrievable items can be prioritized in their own group.==可取回的物品可以在其自身的群組中被優先處理。
Gatherable and purchasable items can be grouped by zone.==可採集與可購買的物品可依區域分組。
Improved handling of items that can be purchased with seals, poetics, and scrip currencies.==改善了可用軍票、詩學神典石與工票等貨幣購買的物品的處理方式。
You can customize these options further by clicking the pencil icon in the top right corner of a list.==你可以點擊清單右上角的鉛筆圖示來進一步自訂這些選項。
