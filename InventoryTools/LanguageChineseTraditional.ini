Allagan Tools is a mult-purpose plugin providing 3 primary features, tracking/displaying your inventory data, helping you plan crafts and providing information about items. There are other features, and they are covered in 'Features'==Allagan Tools 是多用途插件,提供 3 大主要功能:追蹤/顯示物品欄資料、協助規劃製作,以及提供物品資訊。其他功能請參閱「功能」章節。
If you've used Teamcraft or Garland Tools, it takes some inspiration from both.==若你用過 Teamcraft 或 Garland Tools,本插件從兩者汲取了一些靈感。
The plugin will do it's best to keep track of your inventories. Some inventories are only cached when they are first accessed. If you aren't seeing your retainer/free company/glamour chest/etc then please be sure to view them first otherwise the plugin will not be able to cache them.==插件會盡力追蹤你的物品欄。部分物品欄只有在首次開啟後才會被快取。若沒有看到僱員/部隊/投影台等物品欄,請先在遊戲中開啟它們,否則插件無法快取。
Once the plugin knows about the items, you can create lists to narrow down searches for specific items, help you sort the items and a myriad of other things.==插件記錄物品後,你就可以建立清單來縮小搜尋範圍、協助整理物品,以及進行其他各種操作。
The plugin has a dedicated crafts window that lets you create lists of items you want to craft. It'll create a plan that breaks each item down into it's individual parts and will tell you what you're missing. It'll tell you where everything you need is and if you are missing anything, it'll direct you to the place to find/buy the missing items.==插件有專門的製作視窗,讓你建立想製作物品的清單。它會將每個物品拆解為個別素材並告訴你缺少什麼,還會告訴你所需物品的所在位置;若有缺少,會指引你到可以取得/購買的地方。
If you've ever used Teamcraft, you should be right at home.==若你用過 Teamcraft,應該會倍感熟悉。
The plugin has a fairly comprehensive database of information about each item. If you've used garland tools, the information provided is very similar. Clicking on an item's icon within the plugin will always open the item's information window.==插件內建相當完整的物品資訊資料庫。若你用過 Garland Tools,提供的資訊非常相似。在插件中點擊物品圖示即可開啟該物品的資訊視窗。
When using either an item list or a craft list, you can toggle highlighting. This will highlight the items in game so that you can see exactly where the items are. When the plugins windows are active, you can hit the 'Highlight' checkbox to activate highlighting for that list. If you want to trigger this with a macro, please have a look at the commands section of help, you can toggle 'background' highlighting.==使用物品清單或製作清單時,可以切換醒目提示。這會在遊戲中醒目顯示物品,讓你清楚看到物品位置。插件視窗開啟時,勾選「醒目提示」核取方塊即可為該清單啟用。若想透過巨集觸發,請參閱說明中的指令章節,可以切換「背景」醒目提示。
When creating a list or when searching through the results of a list it is possible to use a series of operators to make your search more specific. The available operators are dependant on what you searching against but at present support for !, <, >, >=, <=, = is present.==建立清單或搜尋清單結果時,可以使用一系列運算子讓搜尋更精確。可用的運算子取決於搜尋的欄位,目前支援 !、<、>、>=、<=、=。
! - Show any results that do not contain what is entered - available for text and numbers.==! - 顯示不包含輸入內容的結果 - 適用於文字與數字。
< - Show any results that have a value less than what is entered - available for numbers.==< - 顯示數值小於輸入值的結果 - 適用於數字。
> - Show any results that have a value greater than what is entered - available for numbers.==> - 顯示數值大於輸入值的結果 - 適用於數字。
>= - Show any results that have a value greater or equal to what is entered - available for numbers.==>= - 顯示數值大於或等於輸入值的結果 - 適用於數字。
<= - Show any results that have a value less than or equal to what is entered - available for numbers.==<= - 顯示數值小於或等於輸入值的結果 - 適用於數字。
= - Show any results that have a value equal to exactly what is entered - available for text and numbers.=== - 顯示數值與輸入值完全相等的結果 - 適用於文字與數字。
&& and || AND and OR respectively - Can be used to chain operators together.==&& 與 || 分別代表 AND 與 OR - 可用於串聯多個運算子。
