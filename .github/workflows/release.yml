name: Release

on:
  workflow_dispatch:
permissions:
  contents: write

env:
  INTERNAL_NAME: InventoryTools
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.3
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/dalamud-tc-pin/releases/download/v12.0.2/dalamud-api12-net9.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"
      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore InventoryTools
      - name: Build
        run: >
          dotnet build -c ${{ env.CONFIGURATION }} --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          ${{ env.INTERNAL_NAME }}
      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path "InventoryTools\bin\${{ env.CONFIGURATION }}\*" -DestinationPath "${{ env.INTERNAL_NAME }}.zip"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.INTERNAL_NAME }}.zip
            InventoryTools\bin\${{ env.CONFIGURATION }}\${{ env.INTERNAL_NAME }}.json
