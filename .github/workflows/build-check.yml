name: Build Check

on:
  push:
    branches: [tc-7.30]
    paths-ignore:
      - '**.md'
      - '**/LICENSE*'
      - 'LICENSE*'
  workflow_dispatch:

env:
  INTERNAL_NAME: InventoryTools
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.3
      - name: Download Dalamud
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v7.30.0.1/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile latest.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath latest.zip).Hash
          if ($sha -ne '6E1B3EEA235A26226772566D6A825DDF33E700DCEFEB158D356FBF8FB45650AB') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force latest.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Restore
        run: dotnet restore InventoryTools
      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore ${{ env.INTERNAL_NAME }} -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
